name: astrbot_plugin_Super_AstrBot
display_name: Super_AstrBot 增强中枢
desc: 群聊拟人化融合版：在长期记忆 / 自我学习基座之上，新增**单人格 × 群聊拟人化**的一整套进程内融合能力——群友识别（稳定档案 + 差异化对话策略：语气 / 称呼 / 话题 / 禁忌，只调表层不换人格）、PersonaForge 三层人格（核心特质 / 表层风格 / 动态状态 + 可选双过程内省）、人格演化轨迹（character-sim 经验向量，单轮上限 0.03，带里程碑与失谐标记）、CogEmp 三阶段共情（情绪识别 → 原因理解 → 语气指引）、LATRACE 式时序知识图谱（实体 / 关系带时间语义与证据链，检索附 provenance 并做图扩展）、letta 三级记忆（核心 / 召回 / 归档占比）、AMBRACE 世界书（触发词注入的事实卡）与艾宾浩斯衰减曲线（R=exp(-Δt/S)，默认只展示不写回）、Sibyl / AMBRACE 式回访队列（约定回访 + 前瞻关怀，到期由调度器投递）。控制台按「总览 / 功能 / 人格 / 记忆 / 共情与主动 / 记录 / 系统」重构为 19 页，Notion 风格浅深双主题。所有融合模块均为插件进程内普通 Python 模块（无 docker、无外部服务、无并行框架），缺依赖时 degraded 占位、核心对话不受影响。原有能力保持不变：面向 AstrBot 的长期记忆与自我学习增强插件。分层自适应检索（FTS + 可选向量 + 可选知识图谱路 + RRF 融合 + 可选重排序精选 top-k）、记忆生命周期、现实桥（周记 / 日记 / 随笔：标题留空自动取当天日期时间，支持按类型筛选与勾选导出）、记忆身份归属（按用户跨会话识别，含身份诊断与作用域迁移工具）、反思式自我学习，并内置 Harness 适配层与循环控制机制，保证跨版本与非侵入式增强。可选启用 Agent 记忆函数工具、请求级上下文治理、群聊读空气、主动消息、拟人化学习（风格模仿 / 群内用语 / 好感度，默认进审查队列）、记忆知识图谱（零成本抽取 + 关联召回 + 可视化）、自动审核（规则优先 + 模型兜底）、MaiBot 增强（发送者个性化 + 统一时间衰减）；所有提示词均可自定义，并内置运行监控面板与「全局备份」（全部业务表 + 配置 + 数据库快照打包为 zip；支持逐表合并与完全覆盖两种恢复模式，并可整库替换还原未导出的表）。无需第三方依赖，装上即用；检测不到 Embedding / 重排序提供商时自动降级（纯关键词检索 / 本地词法重排），不打断对话。
short_desc: 单人格群聊拟人化：认得每个人、记得每件事、持续演进自己。
