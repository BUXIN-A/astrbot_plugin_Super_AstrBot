<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Super_AstrBot 控制台</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --border: #262b36;
      --text: #e6e8ee;
      --muted: #9aa3b2;
      --accent: #4c8dff;
      --ok: #3fb950;
      --warn: #d29922;
      --err: #f85149;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 18px 20px 40px;
      background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 14px; line-height: 1.55;
    }
    h1 { font-size: 18px; margin: 0; }
    h2 { font-size: 14px; margin: 0 0 10px; color: var(--muted); font-weight: 600; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .top .sub { color: var(--muted); font-size: 12px; }
    button {
      background: var(--accent); color: #fff; border: 0; border-radius: 6px;
      padding: 6px 12px; cursor: pointer; font-size: 13px;
    }
    button.ghost { background: #232936; color: var(--text); }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-bottom: 18px; }
    .card {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 14px;
    }
    .card .label { color: var(--muted); font-size: 12px; }
    .card .value { font-size: 22px; font-weight: 600; margin-top: 2px; }
    section { margin-bottom: 20px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    input[type="text"] {
      flex: 1 1 240px; min-width: 180px; background: #10131a; color: var(--text);
      border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px; font-size: 13px;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; font-size: 12px; }
    td.content { max-width: 520px; word-break: break-word; }
    .tag { display: inline-block; background: #222834; color: var(--muted); border-radius: 4px; padding: 1px 6px; font-size: 11px; margin-right: 4px; }
    .muted { color: var(--muted); font-size: 12px; }
    .pill { border-radius: 999px; padding: 1px 8px; font-size: 11px; }
    .pill.ok { background: rgba(63,185,80,.15); color: var(--ok); }
    .pill.warn { background: rgba(210,153,34,.15); color: var(--warn); }
    .pill.err { background: rgba(248,81,73,.15); color: var(--err); }
    .empty { color: var(--muted); padding: 10px 0; }
    pre { white-space: pre-wrap; word-break: break-word; margin: 0; font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="top">
    <div>
      <h1>Super_AstrBot 控制台</h1>
      <div class="sub" id="subtitle">正在连接…</div>
    </div>
    <div class="row">
      <button class="ghost" id="btn-refresh">刷新</button>
    </div>
  </div>

  <div class="grid" id="cards"></div>

  <section>
    <h2>检索记忆</h2>
    <div class="row">
      <input type="text" id="search-input" placeholder="输入关键词，例如：项目 上线" />
      <button id="btn-search">检索</button>
      <span class="muted">未填写会话 UMO 时按关键词跨作用域匹配；填写后按混合检索打分。</span>
    </div>
    <div class="row" style="margin-top:8px">
      <input type="text" id="umo-input" placeholder="可选：会话 UMO，例如 aiocqhttp:FriendMessage:12345" />
    </div>
    <div id="search-result" style="margin-top:10px"></div>
  </section>

  <section>
    <h2>记忆（最新 20 条）</h2>
    <div id="memories"></div>
  </section>

  <section>
    <h2>周记</h2>
    <div id="journals"></div>
  </section>

  <section>
    <h2>待审记忆</h2>
    <div id="reviews"></div>
  </section>

  <section>
    <h2>后台任务</h2>
    <div id="jobs"></div>
  </section>

  <script>
    const PLUGIN_NAME = "astrbot_plugin_Super_AstrBot";
    const FALLBACK_BASE = `/api/v1/plugins/extensions/${PLUGIN_NAME}`;
    const bridge = window.AstrBotPluginPage || null;

    async function callApi(endpoint, { method = "GET", params = null, body = null } = {}) {
      // 优先使用插件 Page bridge（它会自动带上鉴权与插件上下文）
      if (bridge && typeof bridge.apiGet === "function") {
        if (method === "GET") return await bridge.apiGet(endpoint, params || {});
        if (typeof bridge.apiPost === "function") return await bridge.apiPost(endpoint, body || {});
      }
      // 兜底：直接访问 Dashboard 转发路由
      let url = `${FALLBACK_BASE}/${endpoint}`;
      if (method === "GET" && params) {
        const qs = new URLSearchParams(params).toString();
        if (qs) url += `?${qs}`;
      }
      const resp = await fetch(url, {
        method,
        headers: { "Content-Type": "application/json" },
        credentials: "same-origin",
        body: method === "GET" ? undefined : JSON.stringify(body || {}),
      });
      const payload = await resp.json().catch(() => ({}));
      if (!resp.ok || payload.status === "error") {
        throw new Error(payload.message || `请求失败（HTTP ${resp.status}）`);
      }
      return payload.data;
    }

    function escapeHtml(text) {
      return String(text == null ? "" : text)
        .replaceAll("&", "&amp;").replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;").replaceAll('"', "&quot;");
    }

    function fmtTime(ts) {
      const value = Number(ts || 0);
      if (!value) return "—";
      const d = new Date(value * 1000);
      const pad = (n) => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    async function loadOverview() {
      try {
        const data = await callApi("overview");
        const memory = data.memory || {};
        const caps = data.capabilities || {};
        const enabledCount = Object.values(caps).filter(Boolean).length;

        const fw = data.framework || {};
        const missing = fw.missing || [];
        document.getElementById("subtitle").innerHTML =
          `插件 ${escapeHtml(data.plugin_version || "未知")}　` +
          `AstrBot ${escapeHtml(fw.version || "未知")}　` +
          `就绪：<span class="pill ${data.ready ? "ok" : "warn"}">${data.ready ? "是" : "否"}</span>　` +
          `数据库：${escapeHtml(data.database || "未初始化")}　` +
          `FTS：<span class="pill ${data.fts ? "ok" : "warn"}">${data.fts ? "可用" : "降级"}</span>　` +
          `能力：${enabledCount}/${Object.keys(caps).length}　` +
          `向量：<span class="pill ${memory.vector_available ? "ok" : "warn"}">${memory.vector_available ? "可用" : "降级"}</span>` +
          (missing.length
            ? `　<span class="pill warn" title="缺失的框架符号：${escapeHtml(missing.join("、"))}">符号缺失 ${missing.length}</span>`
            : "");

        const cards = [
          ["正式记忆", memory.active],
          ["对话缓冲", memory.buffered],
          ["周记", memory.journals],
          ["归档", memory.archived],
          ["后台任务", data.pending_tasks],
        ];
        document.getElementById("cards").innerHTML = cards.map(([label, value]) =>
          `<div class="card"><div class="label">${label}</div><div class="value">${escapeHtml(value ?? "—")}</div></div>`
        ).join("");

        const degraded = data.degraded || [];
        if (degraded.length) {
          document.getElementById("cards").innerHTML +=
            `<div class="card"><div class="label">未生效能力</div><pre>${escapeHtml(
              degraded.map((d) => `${d.capability}：${d.reason}`).join("\n")
            )}</pre></div>`;
        }

        const jobs = data.scheduler || [];
        document.getElementById("jobs").innerHTML = jobs.length
          ? `<table><thead><tr><th>任务</th><th>类型</th><th>运行</th><th>失败</th><th>下次</th><th>最近错误</th></tr></thead><tbody>${
              jobs.map((j) => `<tr>
                <td>${escapeHtml(j.key)}</td>
                <td>${escapeHtml(j.kind)}</td>
                <td>${escapeHtml(j.runs)}</td>
                <td>${escapeHtml(j.failures)}</td>
                <td>${j.seconds_to_next == null ? "—" : Math.round(j.seconds_to_next) + "s 后"}</td>
                <td class="muted">${escapeHtml(j.last_error || "—")}</td>
              </tr>`).join("")
            }</tbody></table>`
          : `<div class="empty">暂无调度任务。</div>`;
      } catch (err) {
        document.getElementById("subtitle").textContent = `加载失败：${err.message}`;
      }
    }

    async function loadMemories() {
      try {
        const rows = await callApi("memories", { params: { limit: 20 } });
        const list = Array.isArray(rows) ? rows : [];
        document.getElementById("memories").innerHTML = list.length
          ? `<table><thead><tr><th>#</th><th>内容</th><th>类型</th><th>来源</th><th>作用域</th><th>重要度</th><th>创建</th></tr></thead><tbody>${
              list.map((m) => `<tr>
                <td>${escapeHtml(m.id)}</td>
                <td class="content">${escapeHtml(m.content)}</td>
                <td>${escapeHtml(m.kind)}</td>
                <td>${escapeHtml(m.source)}</td>
                <td class="muted">${escapeHtml(m.scope)}</td>
                <td>${escapeHtml(Number(m.importance || 0).toFixed(2))}</td>
                <td class="muted">${fmtTime(m.created_at)}</td>
              </tr>`).join("")
            }</tbody></table>`
          : `<div class="empty">暂无记忆。</div>`;
      } catch (err) {
        document.getElementById("memories").innerHTML = `<div class="empty">加载失败：${escapeHtml(err.message)}</div>`;
      }
    }

    async function loadJournals() {
      try {
        const rows = await callApi("journals", { params: { limit: 10 } });
        const list = Array.isArray(rows) ? rows : [];
        document.getElementById("journals").innerHTML = list.length
          ? `<table><thead><tr><th>#</th><th>内容</th><th>标签</th><th>情绪</th><th>时间</th></tr></thead><tbody>${
              list.map((j) => `<tr>
                <td>${escapeHtml(j.id)}</td>
                <td class="content">${escapeHtml(j.content)}</td>
                <td class="muted">${escapeHtml(j.tags)}</td>
                <td>${escapeHtml(j.emotion ?? "—")}</td>
                <td class="muted">${fmtTime(j.event_time)}</td>
              </tr>`).join("")
            }</tbody></table>`
          : `<div class="empty">暂无周记。可在聊天中使用 <code>/sab journal 内容 #标签</code> 记录。</div>`;
      } catch (err) {
        document.getElementById("journals").innerHTML = `<div class="empty">加载失败：${escapeHtml(err.message)}</div>`;
      }
    }

    async function loadReviews() {
      try {
        const rows = await callApi("reviews", { params: { limit: 20 } });
        const list = Array.isArray(rows) ? rows : [];
        if (!list.length) {
          document.getElementById("reviews").innerHTML = `<div class="empty">待审队列为空（或未开启审批模式）。</div>`;
          return;
        }
        document.getElementById("reviews").innerHTML =
          `<table><thead><tr><th>#</th><th>内容</th><th>类型</th><th>操作</th></tr></thead><tbody>${
            list.map((r) => `<tr>
              <td>${escapeHtml(r.id)}</td>
              <td class="content">${escapeHtml(r.content)}</td>
              <td>${escapeHtml(r.kind)}</td>
              <td><button class="ghost" data-action="approve" data-id="${escapeHtml(r.id)}">批准</button>
                  <button class="ghost" data-action="reject" data-id="${escapeHtml(r.id)}">驳回</button></td>
            </tr>`).join("")
          }</tbody></table>`;

        document.querySelectorAll("#reviews button[data-action]").forEach((btn) => {
          btn.addEventListener("click", async () => {
            btn.disabled = true;
            try {
              await callApi("review-action", {
                method: "POST",
                body: { id: Number(btn.dataset.id), action: btn.dataset.action },
              });
              await loadReviews();
            } catch (err) {
              alert(`操作失败：${err.message}`);
              btn.disabled = false;
            }
          });
        });
      } catch (err) {
        document.getElementById("reviews").innerHTML = `<div class="empty">加载失败：${escapeHtml(err.message)}</div>`;
      }
    }

    async function runSearch() {
      const query = document.getElementById("search-input").value.trim();
      const umo = document.getElementById("umo-input").value.trim();
      const box = document.getElementById("search-result");
      if (!query) {
        box.innerHTML = `<div class="empty">请输入关键词。</div>`;
        return;
      }
      box.innerHTML = `<div class="empty">检索中…</div>`;
      try {
        const data = await callApi("search", { method: "POST", body: { query, umo: umo || undefined } });
        const items = (data && data.items) || [];
        const meta = `检索路：${escapeHtml((data && data.routes) || "—")}　耗时：${
          data && data.elapsed_ms != null ? data.elapsed_ms + "ms" : "—"
        }${data && data.degraded ? "　⚠ " + escapeHtml(data.degraded) : ""}`;
        box.innerHTML = `<div class="muted" style="margin-bottom:6px">${meta}</div>` + (
          items.length
            ? `<table><thead><tr><th>#</th><th>内容</th><th>分数</th><th>打分构成</th></tr></thead><tbody>${
                items.map((m) => {
                  const b = m.breakdown || {};
                  const detail = Object.keys(b).length
                    ? Object.entries(b).map(([k, v]) => `${k}=${Number(v).toFixed(3)}`).join("　")
                    : "—";
                  return `<tr>
                    <td>${escapeHtml(m.id)}</td>
                    <td class="content">${escapeHtml(m.content)}</td>
                    <td>${m.score == null ? "—" : Number(m.score).toFixed(3)}</td>
                    <td class="muted">${escapeHtml(detail)}</td>
                  </tr>`;
                }).join("")
              }</tbody></table>`
            : `<div class="empty">没有匹配的记忆。</div>`
        );
      } catch (err) {
        box.innerHTML = `<div class="empty">检索失败：${escapeHtml(err.message)}</div>`;
      }
    }

    async function refreshAll() {
      await Promise.all([loadOverview(), loadMemories(), loadJournals(), loadReviews()]);
    }

    document.getElementById("btn-refresh").addEventListener("click", refreshAll);
    document.getElementById("btn-search").addEventListener("click", runSearch);
    document.getElementById("search-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") runSearch();
    });

    (async function init() {
      if (bridge && typeof bridge.ready === "function") {
        try {
          const ctx = await bridge.ready();
          if (ctx && ctx.displayName) {
            document.title = `${ctx.displayName} 控制台`;
          }
        } catch (err) {
          console.warn("bridge ready 失败，使用兜底请求方式", err);
        }
      }
      await refreshAll();
    })();
  </script>
</body>
</html>
