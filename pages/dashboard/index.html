<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="shell.title">Super_AstrBot 控制台</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <img class="brand-logo" src="./logo.svg" alt="" width="26" height="26" />
        <span class="brand-text">
          <span class="brand-name">Super_AstrBot</span>
          <span class="brand-sub" data-i18n="shell.subtitle">长期记忆 · 自我学习</span>
        </span>
      </div>

      <nav class="nav" id="nav">
        <button class="nav-item" data-page="overview" data-i18n="nav.overview">总览</button>
        <button class="nav-item" data-page="features" data-i18n="nav.features">功能</button>
        <button class="nav-item" data-page="memories" data-i18n="nav.memories">记忆</button>
        <button class="nav-item" data-page="recall" data-i18n="nav.recall">检索</button>
        <button class="nav-item" data-page="journals" data-i18n="nav.journals">周记</button>
        <button class="nav-item" data-page="reviews" data-i18n="nav.reviews">待审</button>
        <button class="nav-item" data-page="system" data-i18n="nav.system">系统</button>
      </nav>

      <div class="sidebar-footer">
        <div class="meta-line" id="footer-version">—</div>
        <div class="meta-line" id="footer-ready">—</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <h1 id="page-title" data-i18n="nav.overview">总览</h1>
        <div class="topbar-actions">
          <button class="btn ghost" id="btn-theme" data-i18n="action.theme">主题</button>
          <button class="btn" id="btn-refresh" data-i18n="action.refresh">刷新</button>
        </div>
      </header>

      <div class="content">
        <!-- 总览 -->
        <section class="page" id="page-overview">
          <div class="stat-grid" id="ov-stats"></div>
          <div class="card">
            <h2 data-i18n="overview.capabilities">能力状态</h2>
            <div class="pill-row" id="ov-caps"></div>
            <div class="degraded" id="ov-degraded"></div>
          </div>
          <div class="card">
            <h2 data-i18n="overview.recent">最近写入的记忆</h2>
            <div class="table-wrap" id="ov-recent"></div>
          </div>
        </section>

        <!-- 功能开关 -->
        <section class="page" id="page-features">
          <div class="card">
            <h2 data-i18n="features.title">功能开关</h2>
            <p class="muted" data-i18n="features.hint">
              开关会立即写入插件配置并热应用；标注「需重载」的项目将在重载插件后生效。
            </p>
            <div class="feature-list" id="feat-list"></div>
          </div>
        </section>

        <!-- 记忆 -->
        <section class="page" id="page-memories">
          <div class="card">
            <div class="filter-bar">
              <label class="field">
                <span data-i18n="filter.status">状态</span>
                <select id="mem-status">
                  <option value="active" data-i18n="status.active">正式</option>
                  <option value="buffered" data-i18n="status.buffered">缓冲</option>
                  <option value="pending" data-i18n="status.pending">待审</option>
                  <option value="archived" data-i18n="status.archived">归档</option>
                  <option value="forgotten" data-i18n="status.forgotten">已遗忘</option>
                </select>
              </label>
              <label class="field">
                <span data-i18n="filter.kind">类型</span>
                <select id="mem-kind">
                  <option value="" data-i18n="filter.all">全部</option>
                  <option value="fact">fact</option>
                  <option value="insight">insight</option>
                  <option value="preference">preference</option>
                  <option value="journal">journal</option>
                  <option value="episode">episode</option>
                </select>
              </label>
              <label class="field grow">
                <span data-i18n="filter.keyword">关键词</span>
                <input type="text" id="mem-keyword" placeholder="内容包含…" />
              </label>
              <button class="btn" id="mem-search" data-i18n="action.query">查询</button>
            </div>
            <div class="table-wrap" id="mem-table"></div>
            <div class="pager">
              <button class="btn ghost" id="mem-prev" data-i18n="action.prev">上一页</button>
              <span class="muted" id="mem-page-info">—</span>
              <button class="btn ghost" id="mem-next" data-i18n="action.next">下一页</button>
            </div>
          </div>
        </section>

        <!-- 检索 -->
        <section class="page" id="page-recall">
          <div class="card">
            <div class="filter-bar">
              <label class="field grow">
                <span data-i18n="recall.query">检索词</span>
                <input type="text" id="recall-query" placeholder="例如：项目 上线 疲惫" />
              </label>
              <label class="field grow">
                <span data-i18n="recall.umo">会话 UMO（可选）</span>
                <input type="text" id="recall-umo" placeholder="aiocqhttp:FriendMessage:12345" />
              </label>
              <label class="field">
                <span data-i18n="recall.limit">条数</span>
                <input type="number" id="recall-limit" value="5" min="1" max="20" />
              </label>
              <button class="btn" id="recall-run" data-i18n="action.search">检索</button>
            </div>
            <p class="muted" data-i18n="recall.hint">不填 UMO 时按关键词跨作用域匹配；填写后走混合检索并展示打分构成。</p>
            <div class="muted" id="recall-meta"></div>
            <div class="table-wrap" id="recall-table"></div>
          </div>
        </section>

        <!-- 周记 -->
        <section class="page" id="page-journals">
          <div class="card">
            <h2 data-i18n="journals.title">周记（现实记忆）</h2>
            <div class="table-wrap" id="jr-table"></div>
            <div class="pager">
              <button class="btn ghost" id="jr-prev" data-i18n="action.prev">上一页</button>
              <span class="muted" id="jr-page-info">—</span>
              <button class="btn ghost" id="jr-next" data-i18n="action.next">下一页</button>
            </div>
          </div>
        </section>

        <!-- 待审 -->
        <section class="page" id="page-reviews">
          <div class="card">
            <h2 data-i18n="reviews.title">待审记忆</h2>
            <p class="muted" id="rv-hint"></p>
            <div class="table-wrap" id="rv-table"></div>
          </div>
        </section>

        <!-- 系统 -->
        <section class="page" id="page-system">
          <div class="card">
            <h2 data-i18n="system.framework">框架与环境</h2>
            <div class="kv-grid" id="sys-fw"></div>
          </div>
          <div class="card">
            <h2 data-i18n="system.jobs">后台任务</h2>
            <div class="table-wrap" id="sys-jobs"></div>
          </div>
          <div class="card">
            <h2 data-i18n="system.budget">辅助调用预算</h2>
            <div class="table-wrap" id="sys-budget"></div>
          </div>
          <div class="card">
            <h2 data-i18n="system.embedding">嵌入模型提供商</h2>
            <div class="table-wrap" id="sys-embed"></div>
          </div>
          <div class="card">
            <h2 data-i18n="system.maintenance">维护</h2>
            <div class="row">
              <button class="btn" id="btn-reindex" data-i18n="action.reindex">重建检索索引</button>
              <span class="muted" data-i18n="system.reindexHint">根据当前配置重建关键词索引与向量索引，不会删除记忆。</span>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <div class="toast-region" id="toasts"></div>

  <div class="modal" id="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true">
      <header class="modal-head">
        <h3 id="modal-title" data-i18n="modal.detail">详情</h3>
        <button class="btn ghost" id="modal-close" data-i18n="action.close">关闭</button>
      </header>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
